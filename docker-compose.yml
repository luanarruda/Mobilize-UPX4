# Sobe um PostgreSQL local sem precisar instalar nada além do Docker.
# Uso: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rotacerta
    ports:
      - "5432:5432"
    volumes:
      - dados-pg:/var/lib/postgresql/data
volumes:
  dados-pg:
